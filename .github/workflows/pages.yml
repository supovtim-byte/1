name: Publish Metelitsa to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh patient reviews
        run: npm run reviews:refresh -- --restore
      - name: Generate doctor pages and catalogue
        run: npm run build
      - name: Verify local resources and JavaScript
        run: npm run check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        # The upload can finish before the artifact is visible to the deployment API.
        run: |
          for pages_artifact_attempt in {1..20}; do
            pages_artifact_count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages-${GITHUB_RUN_ATTEMPT}" --jq '.total_count')
            if [ "$pages_artifact_count" = "1" ]; then
              echo "Pages artifact metadata is available."
              exit 0
            fi
            sleep 3
          done
          echo "Pages artifact metadata did not become available."
          exit 1
      - name: Deploy static site
        id: deployment
        # v4.0.0 discovers uploaded artifacts through the REST API.
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
